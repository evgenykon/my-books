name: Windows

on:
  push:
    branches: [main, "windows/**", "desktop/**", "core/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Shared core tests (desktop JVM)
        run: gradle --no-daemon :shared:desktopTest :vaultJvm:test

      - name: Build runnable app image
        run: gradle --no-daemon :desktopApp:createDistributable

      - name: Package MSI installer
        run: gradle --no-daemon :desktopApp:packageMsi


      # Self-signed Authenticode signature: the publisher field gets filled (trust the
      # published mybooks.cer once to remove the "unknown publisher" prompt). A paid OV/EV
      # certificate is still the only way to silence SmartScreen completely.
      - name: Sign Windows binaries
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $pfx = "desktopApp/signing/mybooks.pfx"
          $pass = "mybooks-sign"
          $targets = @()
          $exe = "desktopApp/build/compose/binaries/main/app/MyBooks/MyBooks.exe"
          if (Test-Path $exe) { $targets += (Resolve-Path $exe).Path }
          $targets += Get-ChildItem "desktopApp/build/compose/binaries/main/msi/*.msi" -ErrorAction SilentlyContinue | ForEach-Object { $_.FullName }
          if (-not $targets) { Write-Host "nothing to sign"; exit 0 }

          $signtool = $null
          $kits = "${env:ProgramFiles(x86)}\Windows Kits\10\bin"
          if (Test-Path $kits) {
            $signtool = Get-ChildItem $kits -Directory | Sort-Object Name -Descending |
              ForEach-Object { Join-Path $_.FullName "x64\signtool.exe" } |
              Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          Write-Host ("signtool: " + $signtool)

          foreach ($t in $targets) {
            $ok = $false
            if ($signtool) {
              & $signtool sign /f $pfx /p $pass /fd SHA256 /td SHA256 /tr "http://timestamp.digicert.com" /d "My Books" $t
              $ok = ($LASTEXITCODE -eq 0)
              Write-Host ("signtool exit " + $LASTEXITCODE + " for " + $t)
            }
            if (-not $ok) {
              try {
                $sec = ConvertTo-SecureString $pass -Force -AsPlainText
                $cert = New-Object System.Security.Cryptography.X509Certificates.X509Certificate2($pfx, $sec)
                $r = Set-AuthenticodeSignature -FilePath $t -Certificate $cert `
                  -TimestampServer "http://timestamp.digicert.com" -HashAlgorithm SHA256
                Write-Host ("powershell signing " + $r.Status + " for " + $t)
              } catch {
                Write-Host ("signing failed for " + $t + ": " + $_)
              }
            }
          }

      - name: Zip portable bundle
        shell: pwsh
        run: Compress-Archive -Path desktopApp/build/compose/binaries/main/app/MyBooks/* -DestinationPath my-books-windows.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: mybooks-windows-zip
          path: my-books-windows.zip
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mybooks-windows-msi
          path: desktopApp/build/compose/binaries/main/msi/*.msi
          if-no-files-found: warn

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-reports
          path: |
            **/build/reports/tests/**
          if-no-files-found: ignore
