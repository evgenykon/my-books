name: Windows

on:
  push:
    branches: [main, "windows/**", "desktop/**", "core/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Shared core tests (desktop JVM)
        run: gradle --no-daemon :shared:desktopTest :vaultJvm:test

      - name: Build runnable app image
        run: gradle --no-daemon :desktopApp:createDistributable

      - name: Package MSI installer
        run: gradle --no-daemon :desktopApp:packageMsi


      # Self-signed code-signing certificate: properties show the publisher, and browsers
      # treat the file a bit more kindly (reputation still has to be earned).
      - name: Sign Windows binaries
        shell: pwsh
        run: |
          $pfx = "desktopApp/signing/mybooks.pfx"
          $sec = ConvertTo-SecureString "mybooks-sign" -Force -AsPlainText
          $cert = New-Object System.Security.Cryptography.X509Certificates.X509Certificate2($pfx, $sec)
          $targets = @()
          $exe = "desktopApp/build/compose/binaries/main/app/MyBooks/MyBooks.exe"
          if (Test-Path $exe) { $targets += (Resolve-Path $exe).Path }
          $targets += Get-ChildItem "desktopApp/build/compose/binaries/main/msi/*.msi" -ErrorAction SilentlyContinue | ForEach-Object { $_.FullName }
          if (-not $targets) { Write-Host "nothing to sign"; exit 0 }
          foreach ($t in $targets) {
            $result = Set-AuthenticodeSignature -FilePath $t -Certificate $cert `
              -TimestampServer "http://timestamp.digicert.com" -HashAlgorithm SHA256
            Write-Host ("signed {0} -> {1}" -f $t, $result.Status)
            if ($result.Status -ne 'Valid') { Write-Host ($result.StatusMessage) }
          }

      - name: Zip portable bundle
        shell: pwsh
        run: Compress-Archive -Path desktopApp/build/compose/binaries/main/app/MyBooks/* -DestinationPath my-books-windows.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: mybooks-windows-zip
          path: my-books-windows.zip
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mybooks-windows-msi
          path: desktopApp/build/compose/binaries/main/msi/*.msi
          if-no-files-found: warn

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-reports
          path: |
            **/build/reports/tests/**
          if-no-files-found: ignore
