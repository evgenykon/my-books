name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.1.0)"
        required: true
        default: "v0.1.0"

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Tests
        run: gradle --no-daemon :shared:testDebugUnitTest
      - name: Build APK
        run: gradle --no-daemon :androidApp:assembleDebug
      - name: Rename APK
        run: cp androidApp/build/outputs/apk/debug/androidApp-debug.apk my-books-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: my-books-android.apk

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Build Kotlin/Native frameworks
        run: gradle --no-daemon :shared:linkReleaseFrameworkMacosArm64 :shared:linkReleaseFrameworkMacosX64
      - name: Assemble universal framework
        run: |
          ARM="$(find shared/build -type d -name 'Shared.framework' -path '*macosArm64*' | head -1)"
          INTEL="$(find shared/build -type d -name 'Shared.framework' -path '*macosX64*' | head -1)"
          test -n "$ARM" && test -n "$INTEL"
          rm -rf macos/Shared.framework
          cp -R "$ARM" macos/Shared.framework
          lipo -create "$ARM/Shared" "$INTEL/Shared" -output macos/Shared.framework/Shared
      - name: Build app bundle
        shell: bash
        run: |
          set -o pipefail
          chmod +x macos/build.sh
          ./macos/build.sh release 2>&1 | tee macos-build.log
      # Logs of a failed run are only visible to signed-in users, while annotations are
      # public: publish the compiler output so a failure can be diagnosed from the run page.
      - name: Report swift errors
        if: failure()
        shell: bash
        run: |
          [ -f macos-build.log ] || exit 0
          echo "=== build log tail ==="
          tail -n 40 macos-build.log || true
          tail -n 12 macos-build.log | while IFS= read -r line; do
            line="${line//'%'/'%25'}"
            line="${line//$'\r'/''}"
            [ -n "$line" ] && echo "::error title=swift-build::${line}"
          done

      - name: Zip app
        run: cd macos/dist && ditto -c -k --sequesterRsrc --keepParent MyBooks.app my-books-macos.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-build-log
          path: macos-build.log
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: macos-app
          path: macos/dist/my-books-macos.zip

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Tests
        run: gradle --no-daemon :shared:desktopTest :vaultJvm:test
      - name: Build runnable app image
        run: gradle --no-daemon :desktopApp:createDistributable
      - name: Install WiX Toolset (for MSI)
        continue-on-error: true
        run: choco install wixtoolset -y --no-progress
      - name: Package MSI installer
        continue-on-error: true
        run: gradle --no-daemon :desktopApp:packageMsi
      - name: Zip portable bundle
        shell: pwsh
        run: Compress-Archive -Path desktopApp/build/compose/binaries/main/app/MyBooks/* -DestinationPath my-books-windows.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: windows-app
          path: my-books-windows.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: windows-msi
          path: desktopApp/build/compose/binaries/main/msi/*.msi
          if-no-files-found: warn

  publish:
    needs: [android, macos, windows]
    # A failed platform must not swallow the release: whatever was built is published.
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
      - name: Flatten assets
        run: |
          mkdir -p assets
          find release-assets -type f -maxdepth 3 -exec cp {} assets/ \;
          ls -la assets
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: My Books ${{ inputs.tag || github.ref_name }}
          draft: false
          generate_release_notes: true
          body: |
            Читалка FB2 для macOS, Windows и Android.
            В этой версии — шифрованные хранилища в git-ветках (книги, заметки, прогресс и настройки).

            **macOS**: распакуйте `my-books-macos.zip`, запустите `MyBooks.app`.
            Приложение подписано ad-hoc, поэтому при первом запуске:
            правый клик по `MyBooks.app` → «Открыть», либо
            `xattr -dr com.apple.quarantine MyBooks.app`.

            **Windows**: `my-books-windows.zip` — распакуйте в любую папку и запустите `MyBooks.exe`
            (JRE внутри, ничего устанавливать не нужно). Либо `MyBooks-1.0.0.msi` —
            установщик с ярлыком в меню «Пуск» и ассоциацией `.fb2`.

            **Android**: `my-books-android.apk` (debug-сборка, устанавливается через «Неизвестные источники»).
          files: assets/*
