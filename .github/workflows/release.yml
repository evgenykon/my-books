name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.1.0)"
        required: true
        default: "v0.1.0"

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Tests
        run: gradle --no-daemon :shared:testDebugUnitTest
      - name: Build APK
        run: gradle --no-daemon :androidApp:assembleDebug
      - name: Rename APK
        run: cp androidApp/build/outputs/apk/debug/androidApp-debug.apk my-books-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: my-books-android.apk

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Build Kotlin/Native frameworks
        run: gradle --no-daemon :shared:linkReleaseFrameworkMacosArm64 :shared:linkReleaseFrameworkMacosX64
      - name: Assemble universal framework
        run: |
          ARM="$(find shared/build -type d -name 'Shared.framework' -path '*macosArm64*' | head -1)"
          INTEL="$(find shared/build -type d -name 'Shared.framework' -path '*macosX64*' | head -1)"
          test -n "$ARM" && test -n "$INTEL"
          rm -rf macos/Shared.framework
          cp -R "$ARM" macos/Shared.framework
          lipo -create "$ARM/Shared" "$INTEL/Shared" -output macos/Shared.framework/Shared
      - name: Build app bundle
        run: chmod +x macos/build.sh && ./macos/build.sh release
      - name: Zip app
        run: cd macos/dist && ditto -c -k --sequesterRsrc --keepParent MyBooks.app my-books-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: macos-app
          path: macos/dist/my-books-macos.zip

  publish:
    needs: [android, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
      - name: Flatten assets
        run: |
          mkdir -p assets
          find release-assets -type f -maxdepth 3 -exec cp {} assets/ \;
          ls -la assets
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: My Books ${{ inputs.tag || github.ref_name }}
          draft: false
          generate_release_notes: true
          body: |
            Читалка FB2 для macOS и Android.

            **macOS**: распакуйте `my-books-macos.zip`, запустите `MyBooks.app`.
            Приложение подписано ad-hoc, поэтому при первом запуске:
            правый клик по `MyBooks.app` → «Открыть», либо
            `xattr -dr com.apple.quarantine MyBooks.app`.

            **Android**: `my-books-android.apk` (debug-сборка, устанавливается через «Неизвестные источники»).
          files: assets/*
